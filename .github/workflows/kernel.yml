name: kernel

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write        # only used by the release-on-tag step

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q \
            bc bison flex libelf-dev libssl-dev \
            clang lld llvm \
            gcc-aarch64-linux-gnu \
            cpio file qemu-system-arm

      - name: kernel source
        run: |
          git clone --depth 1 --branch linux-6.12.y \
            https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git

      # ------------------------------------------------------------- kernel
      - name: configure + build kernel
        working-directory: linux
        run: |
          make ARCH=arm64 tinyconfig
          scripts/kconfig/merge_config.sh -m .config ../kernel/virt-tiny.config
          make ARCH=arm64 LLVM=1 olddefconfig
          # NOTE: scripts are invoked via `bash ...` on purpose — the git
          # exec bit can never cause a "Permission denied" (exit 126).
          bash ../scripts/check-fragment.sh ../kernel/virt-tiny.config .config
          make ARCH=arm64 LLVM=1 -j"$(nproc)" Image.gz
          ls -lh arch/arm64/boot/Image.gz

      # ------------------------------------------------------ userland: busybox
      - name: build busybox (static, aarch64)
        run: |
          curl -fsSLO https://busybox.net/downloads/busybox-1.36.1.tar.bz2
          mkdir -p busybox
          tar -xjf busybox-1.36.1.tar.bz2 -C busybox --strip-components=1
          make -C busybox defconfig
          sed -i 's/^# CONFIG_STATIC is not set/CONFIG_STATIC=y/' busybox/.config
          # tc doesn't compile against 6.8+ kernel headers in busybox 1.36.1
          # and we don't need it in the appliance:
          sed -i 's/^CONFIG_TC=y/# CONFIG_TC is not set/' busybox/.config
          make -C busybox -j"$(nproc)" CROSS_COMPILE=aarch64-linux-gnu-
          file busybox/busybox | grep -q 'aarch64.*statically linked' \
            || { echo 'busybox is not a static aarch64 binary' >&2; exit 1; }

      - name: build initramfs
        run: bash scripts/mkinitramfs.sh busybox/busybox out/rootfs.cpio.gz

      # ---------------------------------------------------- prove it boots
      - name: smoke test - boot it right here in CI
        working-directory: linux
        run: |
          timeout 120 qemu-system-aarch64 \
            -M virt -cpu max -smp 2 -m 256M \
            -kernel arch/arm64/boot/Image.gz \
            -initrd ../out/rootfs.cpio.gz \
            -append "console=ttyAMA0 panic=-1" \
            -device virtio-balloon-device,free-page-reporting=on \
            -netdev user,id=n0 -device virtio-net-device,netdev=n0 \
            -no-reboot -nographic | tee boot.log
          # the guest banner is proof we reached userspace:
          grep -q "tiny-linux" boot.log

      - uses: actions/upload-artifact@v4
        if: always()          # keep boot.log even when the smoke test fails
        with:
          name: qemu-linux-aarch64
          if-no-files-found: error
          path: |
            linux/arch/arm64/boot/Image.gz
            out/rootfs.cpio.gz
            run.sh
            linux/boot.log

      # ------------------------------------------------- release (tags only)
      - name: release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            linux/arch/arm64/boot/Image.gz \
            out/rootfs.cpio.gz \
            --title "tiny-linux $GITHUB_REF_NAME" \
            --generate-notes
