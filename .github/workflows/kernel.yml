name: kernel

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write        # only used by the release-on-tag job

jobs:
  # ------------------------------------------------ shared userland
  # busybox is kernel-config independent — build it ONCE, not per variant.
  busybox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-aarch64-linux-gnu cpio ccache

      - name: ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-busybox-${{ github.run_id }}
          restore-keys: ccache-busybox-

      - name: build busybox (static, aarch64)
        run: |
          ccache --set-config=max_size=500M
          ccache --set-config=sloppiness=time_macros,include_file_mtime,include_file_ctime
          ccache --zero-stats
          curl -fsSLO https://busybox.net/downloads/busybox-1.36.1.tar.bz2
          mkdir -p busybox
          tar -xjf busybox-1.36.1.tar.bz2 -C busybox --strip-components=1
          make -C busybox defconfig
          sed -i 's/^# CONFIG_STATIC is not set/CONFIG_STATIC=y/' busybox/.config
          # tc doesn't compile against 6.8+ kernel headers in busybox 1.36.1
          # and we don't need it in the appliance:
          sed -i 's/^CONFIG_TC=y/# CONFIG_TC is not set/' busybox/.config
          make -C busybox -j"$(nproc)" CROSS_COMPILE=aarch64-linux-gnu- \
            CC="ccache aarch64-linux-gnu-gcc"
          file busybox/busybox | grep -q 'aarch64.*statically linked' \
            || { echo 'busybox is not a static aarch64 binary' >&2; exit 1; }
          ccache --show-stats

      - name: build initramfs
        run: bash scripts/mkinitramfs.sh busybox/busybox out/rootfs.cpio.gz

      - uses: actions/upload-artifact@v4
        with:
          name: initramfs
          if-no-files-found: error
          path: out/rootfs.cpio.gz

  # ------------------------------------------------ kernel variants
  build:
    needs: busybox
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # base appliance kernel (~2-3 MB) — boots Alpine busybox rootfs
          - name: virt-tiny
            fragments: kernel/virt-tiny.config
          # + systemd/glibc distro layer (~3-4 MB) — boots Debian/Ubuntu
          - name: distro
            fragments: "kernel/virt-tiny.config kernel/distro.config"
          # + docker/podman layer — runs containers inside the guest
          - name: containers
            fragments: "kernel/virt-tiny.config kernel/distro.config kernel/containers.config"

    steps:
      - uses: actions/checkout@v4

      - name: deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q \
            bc bison flex libelf-dev libssl-dev \
            clang lld llvm \
            gcc-aarch64-linux-gnu \
            cpio file qemu-system-arm ccache

      - name: ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-kernel-${{ matrix.name }}-${{ github.run_id }}
          restore-keys: |
            ccache-kernel-${{ matrix.name }}-
            ccache-kernel-

      - name: kernel source
        run: |
          git clone --depth 1 --branch linux-6.12.y \
            https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git

      # ------------------------------------------------------------- kernel
      # ccache default dir (~/.cache/ccache) is exactly the cached path above
      - name: configure + build kernel (${{ matrix.name }})
        working-directory: linux
        run: |
          ccache --set-config=max_size=500M
          ccache --set-config=sloppiness=time_macros,include_file_mtime,include_file_ctime
          ccache --zero-stats
          make ARCH=arm64 tinyconfig
          for frag in ${{ matrix.fragments }}; do
            scripts/kconfig/merge_config.sh -m .config "../$frag"
          done
          make ARCH=arm64 LLVM=1 olddefconfig
          # NOTE: scripts are invoked via `bash ...` on purpose — the git
          # exec bit can never cause a "Permission denied" (exit 126).
          for frag in ${{ matrix.fragments }}; do
            bash ../scripts/check-fragment.sh "../$frag" .config
          done
          make ARCH=arm64 LLVM=1 CC="ccache clang" -j"$(nproc)" Image.gz
          ccache --show-stats
          # variant-suffixed name so both matrix jobs can upload to one dir
          mkdir -p ../out
          cp arch/arm64/boot/Image.gz "../out/Image-${{ matrix.name }}.gz"
          ls -lh "../out"

      # ------------------------------------------------ shared userland
      - uses: actions/download-artifact@v4
        with:
          name: initramfs
          path: out

      # ---------------------------------------------------- prove it boots
      - name: smoke test - boot it right here in CI (${{ matrix.name }})
        working-directory: linux
        run: |
          timeout 120 qemu-system-aarch64 \
            -M virt -cpu max -smp 2 -m 256M \
            -kernel "../out/Image-${{ matrix.name }}.gz" \
            -initrd ../out/rootfs.cpio.gz \
            -append "console=ttyAMA0 panic=-1" \
            -device virtio-balloon-device,free-page-reporting=on \
            -netdev user,id=n0 -device virtio-net-device,netdev=n0 \
            -no-reboot -nographic | tee "boot-${{ matrix.name }}.log"
          # the guest banner is proof we reached userspace:
          grep -q "tiny-linux" "boot-${{ matrix.name }}.log"

      # flat layout inside the artifact: after merge-multiple the release
      # job sees dist/Image-*.gz, dist/rootfs.cpio.gz, dist/run.sh (and
      # users who unzip an Actions artifact can `sh run.sh` directly —
      # run.sh expects the images next to itself)
      - name: stage artifact files
        if: always()         # pair with the upload below: keep boot.log on failure
        run: |
          mkdir -p dist
          cp "out/Image-${{ matrix.name }}.gz" dist/
          cp out/rootfs.cpio.gz dist/
          cp run.sh dist/
          [ -f "linux/boot-${{ matrix.name }}.log" ] && \
            cp "linux/boot-${{ matrix.name }}.log" dist/ || true
          ls -lh dist

      - uses: actions/upload-artifact@v4
        if: always()          # keep boot.log even when the smoke test fails
        with:
          name: qemu-linux-${{ matrix.name }}
          if-no-files-found: error
          path: dist

  # ------------------------------------------------- release (tags only)
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: download all variant artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: qemu-linux-*
          merge-multiple: true   # flatten: dist/Image-*.gz, dist/rootfs.cpio.gz, ...

      # NOTE: files are attached individually (gh release create takes a
      # bare file list) — never zipped inside an archive.
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lh dist
          gh release create "$GITHUB_REF_NAME" \
            dist/Image-* \
            dist/rootfs.cpio.gz \
            dist/run.sh \
            --title "tiny-linux $GITHUB_REF_NAME" \
            --generate-notes